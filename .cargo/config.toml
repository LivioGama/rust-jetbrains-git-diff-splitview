[build]
rustflags = ["-A", "warnings"]
jobs = 4
incremental = true
target-dir = "target"

[profile.dev]
opt-level = 0
debug = true
overflow-checks = false
lto = false
panic = 'unwind'
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
debug = false
lto = "fat"
codegen-units = 1
panic = 'abort'
strip = true
rpath = false

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=lld",
]

[target.x86_64-apple-darwin]
rustflags = ["-A", "warnings", "-C", "target-cpu=native"]

[target.aarch64-apple-darwin]
linker = "clang"
rustflags = ["-A", "warnings", "-C", "target-cpu=native"]
