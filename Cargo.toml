[package]
name = "diffsplit"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "diffsplit"
path = "src/main.rs"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
git2 = "0.20"
diff = "0.1"
similar = "2.6"
anyhow = "1.0"
winit = "0.30"
icrate = "0.1"
objc2 = "0.5"
kurbo = "0.9"
imara-diff = "0.2"
dissimilar = "1.0"
regex = "1.10"

[profile.dev]
opt-level = 0
debug = true
overflow-checks = false
lto = false
panic = 'unwind'
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
debug = false
lto = "fat"
codegen-units = 1
panic = 'abort'
strip = true
rpath = false
